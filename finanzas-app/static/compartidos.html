<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzasApp — Gastos Compartidos</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 flex flex-col z-20 border-r border-slate-800 -translate-x-full md:translate-x-0 transition-transform duration-300"></aside>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden" onclick="closeSidebar()"></div>

  <main class="md:ml-64 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-4 md:px-8 py-4 flex items-center gap-3 sticky top-0 z-10">
      <button class="md:hidden p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 flex-shrink-0" onclick="openSidebar()" aria-label="Abrir menú">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex-1 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-semibold text-slate-800 dark:text-white">Gastos Compartidos</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Viajes, alquileres, cenas y más</p>
      </div>
      <button id="btn-new-group" class="bg-blue-700 hover:bg-blue-800 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
        + Nuevo grupo
      </button>
      </div>
    </header>

    <div class="p-4 md:p-8 flex-1">

      <!-- Tabs activos / saldados -->
      <div class="flex gap-1 mb-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-1 w-fit">
        <button id="tab-activos" data-tab="activos" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium bg-blue-700 text-white transition">Activos</button>
        <button id="tab-saldados" data-tab="saldados" class="tab-btn px-4 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Saldados</button>
      </div>

      <!-- Grid de grupos -->
      <div id="groups-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-slate-400 text-sm col-span-full">Cargando...</p>
      </div>
    </div>
  </main>

  <!-- Panel de detalle (slide-in desde la derecha) -->
  <div id="detail-overlay" class="hidden fixed inset-0 bg-black/50 z-40" data-action="close-detail"></div>
  <aside id="detail-panel" class="fixed inset-y-0 right-0 w-full max-w-2xl bg-white dark:bg-slate-900 shadow-2xl z-50 flex flex-col translate-x-full transition-transform duration-300 border-l border-slate-200 dark:border-slate-700">
    <!-- Header del panel -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex-shrink-0">
      <div>
        <h2 id="detail-title" class="text-base font-semibold text-slate-800 dark:text-white"></h2>
        <p id="detail-desc" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-add-expense" class="bg-blue-700 hover:bg-blue-800 text-white font-semibold px-3 py-1.5 rounded-lg text-xs transition">
          + Gasto
        </button>
        <button id="btn-settle" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition"></button>
        <button id="btn-delete-group" class="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
        <button data-action="close-detail" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Cuerpo del panel con scroll -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6">

      <!-- Tabla de pagos -->
      <div>
        <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">Pagos registrados</h3>
        <div id="expenses-empty" class="hidden text-sm text-slate-400 py-4 text-center">Todavía no hay pagos. Agregá el primero.</div>
        <div class="overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-700">
          <table id="expenses-table" class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-slate-800">
              <tr>
                <th class="text-left px-4 py-2.5 text-xs font-semibold text-slate-500 dark:text-slate-400">Quién pagó</th>
                <th class="text-left px-4 py-2.5 text-xs font-semibold text-slate-500 dark:text-slate-400">Descripción</th>
                <th class="text-right px-4 py-2.5 text-xs font-semibold text-slate-500 dark:text-slate-400">Monto</th>
                <th class="text-center px-4 py-2.5 text-xs font-semibold text-slate-500 dark:text-slate-400">Fecha</th>
                <th class="px-2 py-2.5"></th>
              </tr>
            </thead>
            <tbody id="expenses-body" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
          </table>
        </div>
      </div>

      <!-- Balances -->
      <div>
        <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">Balance por persona</h3>
        <div id="balances-empty" class="hidden text-sm text-slate-400 py-2">Sin datos aún.</div>
        <div id="balances-list" class="space-y-2"></div>
      </div>

      <!-- Liquidación -->
      <div id="settlements-section">
        <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">Liquidación</h3>
        <div id="settlements-empty" class="hidden text-sm text-slate-400 py-2">Todo está saldado.</div>
        <div id="settlements-list" class="space-y-2"></div>
      </div>

    </div>
  </aside>

  <!-- ── Modal: Nuevo grupo ────────────────────────────────── -->
  <div id="modal-group" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 px-4">
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl w-full max-w-md border border-slate-200 dark:border-slate-700">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
        <h2 class="text-base font-semibold text-slate-800 dark:text-white">Nuevo grupo</h2>
        <button data-action="close-group-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 text-lg leading-none">✕</button>
      </div>
      <div class="p-6">
        <div id="group-error" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>
        <form id="group-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nombre del grupo</label>
            <input type="text" id="g-name" required placeholder="Ej: Viaje a Bariloche"
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Descripción (opcional)</label>
            <input type="text" id="g-desc" placeholder="Ej: Enero 2025"
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Participantes <span class="text-slate-400 font-normal">(mínimo 2)</span></label>
            <div id="participants-inputs" class="space-y-2">
              <div class="flex gap-2 participant-row">
                <input type="text" placeholder="Nombre participante 1" class="participant-name flex-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                <button type="button" data-action="remove-participant" class="p-2 text-slate-400 hover:text-red-500 transition hidden">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="flex gap-2 participant-row">
                <input type="text" placeholder="Nombre participante 2" class="participant-name flex-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
                <button type="button" data-action="remove-participant" class="p-2 text-slate-400 hover:text-red-500 transition hidden">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
            <button type="button" id="btn-add-participant" class="mt-2 text-sm text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Agregar participante
            </button>
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" data-action="close-group-modal" class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition">Cancelar</button>
            <button type="submit" id="group-submit" class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg text-sm transition disabled:opacity-60">Crear grupo</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Modal: Nuevo gasto ────────────────────────────────── -->
  <div id="modal-expense" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 px-4">
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl w-full max-w-sm border border-slate-200 dark:border-slate-700">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
        <h2 class="text-base font-semibold text-slate-800 dark:text-white">Registrar pago</h2>
        <button data-action="close-expense-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 text-lg leading-none">✕</button>
      </div>
      <div class="p-6">
        <div id="expense-error" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>
        <form id="expense-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Quién pagó</label>
            <select id="e-participant" required
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Descripción</label>
            <input type="text" id="e-description" required placeholder="Ej: Nafta, Hotel, Supermercado"
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Monto</label>
            <input type="number" id="e-amount" min="0.01" step="0.01" required
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Fecha (opcional)</label>
            <input type="date" id="e-date"
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" data-action="close-expense-modal" class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition">Cancelar</button>
            <button type="submit" id="expense-submit" class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg text-sm transition disabled:opacity-60">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/common.js?v=1"></script>
  <script src="/js/compartidos.js"></script>
</body>
</html>
