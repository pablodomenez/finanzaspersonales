<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzasApp — Bienvenida</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/design.css" />
  <script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: "#2563eb", hover: "#1d4ed8", light: "#dbeafe" }
        },
        fontFamily: {
          sans: ["Inter", "system-ui", "-apple-system", "sans-serif"]
        }
      }
    }
  };
</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg">

    <!-- Progress bar -->
    <div class="mb-8">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs text-slate-400">Paso <span id="step-num">1</span> de 3</span>
        <button onclick="skipOnboarding()" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">Omitir →</button>
      </div>
      <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-1.5">
        <div id="progress-bar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-500" style="width:33%"></div>
      </div>
    </div>

    <!-- Steps -->
    <div id="step-1" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-700 p-8 shadow-sm">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="text-3xl">💰</span>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">¡Bienvenido a FinanzasApp!</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Configuremos tu cuenta en 3 pasos rápidos</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">¿Cuál es tu moneda principal?</label>
          <select id="currency" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="ARS">🇦🇷 Peso Argentino (ARS)</option>
            <option value="USD">🇺🇸 Dólar estadounidense (USD)</option>
            <option value="BRL">🇧🇷 Real brasileño (BRL)</option>
            <option value="CLP">🇨🇱 Peso chileno (CLP)</option>
            <option value="UYU">🇺🇾 Peso uruguayo (UYU)</option>
            <option value="MXN">🇲🇽 Peso mexicano (MXN)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">¿En qué país vivís?</label>
          <select id="country" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Argentina">🇦🇷 Argentina</option>
            <option value="Uruguay">🇺🇾 Uruguay</option>
            <option value="Chile">🇨🇱 Chile</option>
            <option value="Brasil">🇧🇷 Brasil</option>
            <option value="México">🇲🇽 México</option>
            <option value="Colombia">🇨🇴 Colombia</option>
            <option value="Otro">🌎 Otro</option>
          </select>
        </div>
      </div>

      <button onclick="goStep(2)" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition-colors">
        Continuar →
      </button>
    </div>

    <div id="step-2" class="hidden bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-700 p-8 shadow-sm">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-emerald-100 dark:bg-emerald-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="text-3xl">💼</span>
        </div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Tu primer ingreso</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Registrá tu ingreso principal para empezar a hacer seguimiento</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Descripción</label>
          <input id="income-desc" type="text" placeholder="Ej: Sueldo de enero" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Monto mensual aproximado</label>
          <input id="income-amount" type="number" placeholder="0" min="0" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400" />
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="goStep(1)" class="flex-1 py-3 rounded-xl border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-400 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
          ← Atrás
        </button>
        <button onclick="saveIncomeAndNext()" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition-colors">
          Continuar →
        </button>
      </div>
      <button onclick="goStep(3)" class="mt-2 w-full text-center text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 py-1">Omitir este paso</button>
    </div>

    <div id="step-3" class="hidden bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-700 p-8 shadow-sm">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-amber-100 dark:bg-amber-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="text-3xl">🎯</span>
        </div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Tu primer presupuesto</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">Establecé un límite de gasto mensual para empezar a controlar tus finanzas</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Categoría</label>
          <select id="budget-cat" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="5">🍔 Comida</option>
            <option value="6">🚌 Transporte</option>
            <option value="7">🏠 Vivienda</option>
            <option value="8">🏥 Salud</option>
            <option value="10">🎮 Entretenimiento</option>
            <option value="13">💡 Servicios</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Límite mensual</label>
          <input id="budget-amount" type="number" placeholder="0" min="0" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400" />
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="goStep(2)" class="flex-1 py-3 rounded-xl border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-400 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
          ← Atrás
        </button>
        <button onclick="saveBudgetAndFinish()" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition-colors">
          ¡Listo, ir al dashboard! 🚀
        </button>
      </div>
      <button onclick="skipOnboarding()" class="mt-2 w-full text-center text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 py-1">Omitir este paso</button>
    </div>

  </div>

  <script src="/js/api.js?v=5"></script>
  <script>
    // Verificar auth
    if (!getToken()) window.location.href = "/login.html";

    let currentStep = 1;

    function goStep(n) {
      document.getElementById(`step-${currentStep}`).classList.add("hidden");
      currentStep = n;
      document.getElementById(`step-${n}`).classList.remove("hidden");
      document.getElementById("step-num").textContent = n;
      document.getElementById("progress-bar").style.width = (n / 3 * 100) + "%";
    }

    async function saveProfile() {
      const currency = document.getElementById("currency").value;
      const country  = document.getElementById("country").value;
      try {
        await apiFetch("/api/profile", { method: "PUT", body: JSON.stringify({ currency, country }) });
      } catch (_) {}
    }

    async function goStep2AfterProfile() {
      await saveProfile();
      goStep(2);
    }

    // Override button to save first
    document.querySelector("#step-1 button[onclick='goStep(2)']").onclick = goStep2AfterProfile;

    async function saveIncomeAndNext() {
      const desc   = document.getElementById("income-desc").value.trim();
      const amount = parseFloat(document.getElementById("income-amount").value);
      if (desc && amount > 0) {
        const now = new Date();
        try {
          await apiFetch("/api/transactions", {
            method: "POST",
            body: JSON.stringify({
              description: desc,
              amount,
              type: "income",
              category_id: 1,
              date: now.toISOString(),
            }),
          });
        } catch (_) {}
      }
      goStep(3);
    }

    async function saveBudgetAndFinish() {
      const catId  = parseInt(document.getElementById("budget-cat").value);
      const amount = parseFloat(document.getElementById("budget-amount").value);
      const now    = new Date();
      if (catId && amount > 0) {
        try {
          await apiFetch("/api/budgets", {
            method: "POST",
            body: JSON.stringify({
              category_id: catId,
              month: now.getMonth() + 1,
              year: now.getFullYear(),
              limit_amount: amount,
            }),
          });
        } catch (_) {}
      }
      await skipOnboarding();
    }

    async function skipOnboarding() {
      try { await apiFetch("/api/auth/complete-onboarding", { method: "POST" }); } catch (_) {}
      localStorage.setItem("onboarding_done", "true");
      window.location.href = "/dashboard.html";
    }
  </script>
</body>
</html>
