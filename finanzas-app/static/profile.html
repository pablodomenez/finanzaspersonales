<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>FinanzasApp — Mi Perfil</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/design.css" />
  <script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: "#2563eb", hover: "#1d4ed8", light: "#dbeafe" }
        },
        fontFamily: {
          sans: ["Inter", "system-ui", "-apple-system", "sans-serif"]
        }
      }
    }
  };
</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 flex flex-col z-20 border-r border-slate-800 -translate-x-full md:translate-x-0 transition-transform duration-300"></aside>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden" onclick="closeSidebar()"></div>

  <main class="md:ml-64 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-4 md:px-8 py-4 flex items-center gap-3 sticky top-0 z-10">
      <button class="md:hidden p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 flex-shrink-0" onclick="openSidebar()" aria-label="Abrir menú">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Mi Perfil</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Datos personales y configuración de cuenta</p>
      </div>
    </header>

    <div class="p-4 md:p-8 flex-1">
      <!-- Alerta -->
      <div id="alert" class="hidden mb-6 px-4 py-3 rounded-lg text-sm font-medium border"></div>

      <div class="max-w-2xl space-y-5">

        <!-- Avatar + resumen -->
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5 flex items-center gap-5">
          <div id="avatar-display"
            class="text-4xl w-16 h-16 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center select-none cursor-pointer hover:border-blue-400 transition"
            title="Elegí un avatar" onclick="toggleAvatarPicker()">👤</div>
          <div class="flex-1 min-w-0">
            <p id="display-name" class="text-base font-bold text-slate-800 dark:text-white truncate">—</p>
            <p id="display-email" class="text-sm text-slate-500 dark:text-slate-400 truncate"></p>
            <p id="display-occupation" class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 truncate"></p>
          </div>
          <div class="text-right text-xs text-slate-400">
            <p>Miembro desde</p>
            <p id="info-created" class="font-medium text-slate-600 dark:text-slate-300 mt-0.5">—</p>
          </div>
        </div>

        <!-- Selector de avatar -->
        <div id="avatar-picker" class="hidden bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5">
          <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">Elegí tu avatar</p>
          <div id="avatar-grid" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Formulario -->
        <form id="profile-form" class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700">
          <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700">
            <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Datos personales</h2>
          </div>
          <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre completo *</label>
                <input type="text" id="p-name" required placeholder="Tu nombre"
                  class="form-input" />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Teléfono</label>
                <input type="tel" id="p-phone" placeholder="+54 11 1234-5678"
                  class="form-input" />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Fecha de nacimiento</label>
                <input type="date" id="p-birth"
                  class="form-input" />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">País</label>
                <input type="text" id="p-country" placeholder="Argentina"
                  class="form-input" />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Moneda principal</label>
                <select id="p-currency"
                  class="form-input">
                  <option value="ARS">ARS — Peso argentino</option>
                  <option value="USD">USD — Dólar estadounidense</option>
                  <option value="EUR">EUR — Euro</option>
                  <option value="BRL">BRL — Real brasileño</option>
                  <option value="CLP">CLP — Peso chileno</option>
                  <option value="COP">COP — Peso colombiano</option>
                  <option value="MXN">MXN — Peso mexicano</option>
                  <option value="UYU">UYU — Peso uruguayo</option>
                  <option value="PEN">PEN — Sol peruano</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Ocupación</label>
                <input type="text" id="p-occupation" placeholder="Ej: Desarrollador, Médico..."
                  class="form-input" />
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Bio (opcional)</label>
              <textarea id="p-bio" rows="3" placeholder="Contá algo sobre vos o tus objetivos financieros..."
                class="form-input resize-none"></textarea>
            </div>
            <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
              <input type="email" id="p-email" disabled
                class="w-full px-3 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-400 dark:text-slate-500 text-sm cursor-not-allowed" />
              <p class="text-xs text-slate-400 mt-1">El email no se puede modificar.</p>
            </div>
          </div>
          <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-700 flex justify-end">
            <button type="submit" id="save-btn"
              class="btn-primary">
              Guardar cambios
            </button>
          </div>
        </form>

        <!-- Personalizar menú -->
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700">
          <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between gap-3">
            <div>
              <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Personalizar menú</h2>
              <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">Arrastrá para reordenar · Desactivá las secciones que no usás</p>
            </div>
            <button id="nav-restore-btn" type="button"
              class="flex-shrink-0 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
              Restaurar orden
            </button>
          </div>
          <div id="nav-sort-list" class="p-3 space-y-1 select-none"></div>
          <div id="nav-alert" class="hidden mx-4 mb-3 px-3 py-2 rounded-lg text-xs font-medium border"></div>
          <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-700 flex justify-end">
            <button id="nav-save-btn" type="button"
              class="btn-primary">
              Guardar menú
            </button>
          </div>
        </div>

        <!-- Tour guiado -->
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5 flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">Tour guiado</p>
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5">Volvé a ver la recorrida de bienvenida de la app</p>
          </div>
          <button onclick="localStorage.removeItem('_tour_done'); window.location.href='/dashboard.html';"
            class="btn-secondary flex-shrink-0">
            Reiniciar tour
          </button>
        </div>

      </div>
    </div>
  </main>

  <script src="/js/api.js?v=5"></script>
  <script src="/js/sidebar.js?v=5"></script>
  <script src="/js/common.js?v=5"></script>
  <script src="/js/profile.js"></script>
  <script>
  // ── Personalización del menú ──────────────────────────────────────────────
  (function () {
    const ALL_ITEMS = [
      { id: "dashboard",    label: "Dashboard",      icon: "🗂️" },
      { id: "transactions", label: "Movimientos",    icon: "↔️" },
      { id: "budgets",      label: "Presupuestos",   icon: "👛" },
      { id: "cards",        label: "Tarjetas",       icon: "💳" },
      { id: "debts",        label: "Deudas",         icon: "👥" },
      { id: "goals",        label: "Objetivos",      icon: "🎯" },
      { id: "inversiones",  label: "Inversiones",    icon: "📈" },
      { id: "alquileres",   label: "Alquileres",     icon: "🏠" },
      { id: "servicios",    label: "Servicios",      icon: "⚡" },
      { id: "promociones",  label: "Promociones",    icon: "🏷️" },
      { id: "prestamos",    label: "Préstamos",      icon: "🏦" },
      { id: "compartidos",  label: "Compartidos",    icon: "👫" },
      { id: "reports",      label: "Reportes",       icon: "📊" },
      { id: "decisiones",   label: "Decisiones IA",  icon: "✨" },
      { id: "feedback",     label: "Feedback",       icon: "💬" },
    ];
    const DEFAULT_ORDER = ALL_ITEMS.map(i => i.id);
    const ITEM_MAP = Object.fromEntries(ALL_ITEMS.map(i => [i.id, i]));

    let currentOrder = [...DEFAULT_ORDER];
    let currentHidden = new Set();
    let dragSrc = null;

    const listEl = document.getElementById("nav-sort-list");
    const alertEl = document.getElementById("nav-alert");

    function showNavAlert(msg, ok) {
      alertEl.textContent = msg;
      alertEl.className = ok
        ? "mx-4 mb-3 px-3 py-2 rounded-lg text-xs font-medium border bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 border-emerald-200 dark:border-emerald-700"
        : "mx-4 mb-3 px-3 py-2 rounded-lg text-xs font-medium border bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 border-red-200 dark:border-red-700";
      alertEl.classList.remove("hidden");
      setTimeout(() => alertEl.classList.add("hidden"), 3000);
    }

    function render() {
      listEl.innerHTML = "";
      currentOrder.forEach(id => {
        const item = ITEM_MAP[id];
        if (!item) return;
        const isLocked = id === "dashboard";
        const isHidden = currentHidden.has(id);
        const row = document.createElement("div");
        row.dataset.id = id;
        row.draggable = !isLocked;
        row.className = [
          "flex items-center gap-3 px-3 py-2.5 rounded-lg border transition-colors",
          isHidden
            ? "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-50"
            : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700",
          isLocked ? "cursor-default" : "cursor-grab active:cursor-grabbing",
        ].join(" ");

        row.innerHTML = `
          <span class="text-slate-300 dark:text-slate-600 flex-shrink-0 ${isLocked ? "opacity-20" : ""}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
              <circle cx="4" cy="3" r="1.2"/><circle cx="10" cy="3" r="1.2"/>
              <circle cx="4" cy="7" r="1.2"/><circle cx="10" cy="7" r="1.2"/>
              <circle cx="4" cy="11" r="1.2"/><circle cx="10" cy="11" r="1.2"/>
            </svg>
          </span>
          <span class="text-base leading-none flex-shrink-0">${item.icon}</span>
          <span class="text-sm font-medium text-slate-700 dark:text-slate-300 flex-1">${item.label}</span>
          ${isLocked
            ? `<span class="text-xs text-slate-400 dark:text-slate-500 italic flex-shrink-0">siempre visible</span>`
            : `<button type="button" data-toggle="${id}"
                class="flex-shrink-0 relative inline-flex w-9 h-5 rounded-full transition-colors focus:outline-none ${isHidden ? "bg-slate-300 dark:bg-slate-600" : "bg-blue-600"}"
                aria-pressed="${!isHidden}" title="${isHidden ? "Activar" : "Ocultar"}">
                <span class="inline-block w-4 h-4 mt-0.5 rounded-full bg-white shadow transition-transform ${isHidden ? "translate-x-0.5" : "translate-x-4"}"></span>
              </button>`
          }`;

        // Drag events
        row.addEventListener("dragstart", e => {
          if (isLocked) { e.preventDefault(); return; }
          dragSrc = id;
          e.dataTransfer.effectAllowed = "move";
          row.classList.add("opacity-40");
        });
        row.addEventListener("dragend", () => {
          row.classList.remove("opacity-40");
          listEl.querySelectorAll("[data-id]").forEach(r => r.classList.remove("border-blue-400", "dark:border-blue-500"));
        });
        row.addEventListener("dragover", e => {
          if (!dragSrc || id === dragSrc || id === "dashboard") return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          listEl.querySelectorAll("[data-id]").forEach(r => r.classList.remove("border-blue-400", "dark:border-blue-500"));
          row.classList.add("border-blue-400", "dark:border-blue-500");
        });
        row.addEventListener("drop", e => {
          e.preventDefault();
          if (!dragSrc || dragSrc === id || id === "dashboard") return;
          const fromIdx = currentOrder.indexOf(dragSrc);
          const toIdx = currentOrder.indexOf(id);
          if (fromIdx === -1 || toIdx === -1) return;
          currentOrder.splice(fromIdx, 1);
          currentOrder.splice(toIdx, 0, dragSrc);
          dragSrc = null;
          render();
        });

        // Toggle button
        const toggleBtn = row.querySelector("[data-toggle]");
        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            const tid = toggleBtn.dataset.toggle;
            if (currentHidden.has(tid)) currentHidden.delete(tid);
            else currentHidden.add(tid);
            render();
          });
        }

        listEl.appendChild(row);
      });
    }

    // Load preferences from API
    async function loadPrefs() {
      try {
        const prefs = await apiFetch("/api/profile/nav-preferences");
        currentOrder = prefs.order || [...DEFAULT_ORDER];
        currentHidden = new Set(prefs.hidden || []);
      } catch (_) {
        currentOrder = [...DEFAULT_ORDER];
        currentHidden = new Set();
      }
      render();
    }

    // Save button
    document.getElementById("nav-save-btn").addEventListener("click", async () => {
      const btn = document.getElementById("nav-save-btn");
      btn.disabled = true;
      btn.textContent = "Guardando...";
      try {
        await apiFetch("/api/profile/nav-preferences", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order: currentOrder, hidden: [...currentHidden] }),
        });
        showNavAlert("Menú guardado correctamente", true);
      } catch (err) {
        console.error("Error guardando nav-preferences:", err);
        showNavAlert("Error al guardar. Intentá de nuevo.", false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar menú";
      }
    });

    // Restore button
    document.getElementById("nav-restore-btn").addEventListener("click", () => {
      currentOrder = [...DEFAULT_ORDER];
      currentHidden = new Set();
      render();
    });

    // Init once API is available
    if (typeof apiFetch === "function" && typeof getToken === "function" && getToken()) {
      loadPrefs();
    } else {
      // Wait briefly for api.js to load
      window.addEventListener("load", () => {
        if (typeof apiFetch === "function" && getToken()) loadPrefs();
        else render();
      });
    }
  })();
  </script>
</body>
</html>
