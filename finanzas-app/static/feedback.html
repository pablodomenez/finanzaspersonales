<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>FinanzasApp — Feedback</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/design.css" />
  <script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: "#2563eb", hover: "#1d4ed8", light: "#dbeafe" }
        },
        fontFamily: {
          sans: ["Inter", "system-ui", "-apple-system", "sans-serif"]
        }
      }
    }
  };
</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 flex flex-col z-20 border-r border-slate-800 -translate-x-full md:translate-x-0 transition-transform duration-300"></aside>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden" onclick="closeSidebar()"></div>

  <main class="md:ml-64 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-4 md:px-8 py-4 flex items-center gap-3 sticky top-0 z-10">
      <button class="md:hidden p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 flex-shrink-0" onclick="openSidebar()" aria-label="Abrir menú">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex-1">
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Feedback</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Tu opinión nos ayuda a mejorar la app</p>
      </div>
    </header>

    <div class="p-4 md:p-8 flex-1 max-w-3xl mx-auto w-full">

      <!-- Formulario -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 mb-8">
        <h2 class="text-base font-semibold text-slate-800 dark:text-white mb-6">¿Cómo calificarías la app?</h2>

        <!-- Estrellas -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-3">Calificación</label>
          <div id="stars" class="flex gap-2">
            <button type="button" data-value="1" onclick="setRating(1)" class="star-btn text-4xl transition-transform hover:scale-110 focus:outline-none">☆</button>
            <button type="button" data-value="2" onclick="setRating(2)" class="star-btn text-4xl transition-transform hover:scale-110 focus:outline-none">☆</button>
            <button type="button" data-value="3" onclick="setRating(3)" class="star-btn text-4xl transition-transform hover:scale-110 focus:outline-none">☆</button>
            <button type="button" data-value="4" onclick="setRating(4)" class="star-btn text-4xl transition-transform hover:scale-110 focus:outline-none">☆</button>
            <button type="button" data-value="5" onclick="setRating(5)" class="star-btn text-4xl transition-transform hover:scale-110 focus:outline-none">☆</button>
          </div>
          <p id="rating-label" class="text-sm text-slate-400 mt-2 h-5"></p>
        </div>

        <!-- Tema -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">¿Sobre qué sección?</label>
          <select id="fb-tema" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="General">General</option>
            <option value="Dashboard">Dashboard</option>
            <option value="Movimientos">Movimientos</option>
            <option value="Presupuestos">Presupuestos</option>
            <option value="Tarjetas">Tarjetas</option>
            <option value="Deudas">Deudas</option>
            <option value="Objetivos">Objetivos</option>
            <option value="Inversiones">Inversiones</option>
            <option value="Servicios">Servicios</option>
            <option value="Promociones">Promociones</option>
            <option value="Compartidos">Compartidos</option>
            <option value="Reportes">Reportes</option>
            <option value="Decisiones">Decisiones</option>
          </select>
        </div>

        <!-- Mensaje -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Mensaje <span class="text-slate-400 font-normal">(opcional)</span></label>
          <textarea id="fb-mensaje" rows="4" placeholder="¿Qué mejorarías? ¿Qué te encantó? ¿Tenés alguna sugerencia?"
            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 resize-none"></textarea>
        </div>

        <!-- Error -->
        <div id="fb-error" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>

        <!-- Botón -->
        <button id="fb-submit" onclick="submitFeedback()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors flex items-center justify-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i>
          Enviar feedback
        </button>

        <!-- Éxito -->
        <div id="fb-success" class="hidden mt-4 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 text-sm rounded-lg p-4 flex items-center gap-3">
          <i data-lucide="check-circle-2" class="w-5 h-5 shrink-0"></i>
          <span>¡Gracias por tu feedback! Nos ayuda mucho a mejorar.</span>
        </div>
      </div>

      <!-- Historial -->
      <div>
        <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-4 flex items-center gap-2">
          <i data-lucide="clock" class="w-4 h-4"></i>
          Mis feedbacks anteriores
        </h2>
        <div id="history-list" class="space-y-3">
          <p class="text-sm text-slate-400">Cargando...</p>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/api.js?v=5"></script>
  <script src="/js/sidebar.js?v=5"></script>
  <script src="/js/feedback.js"></script>
  <script src="/js/common.js?v=5"></script>
</body>
</html>
