<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Iniciando sesión…</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/design.css" />
  <script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: "#2563eb", hover: "#1d4ed8", light: "#dbeafe" }
        },
        fontFamily: {
          sans: ["Inter", "system-ui", "-apple-system", "sans-serif"]
        }
      }
    }
  };
</script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900">
  <div class="text-center">
    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-slate-500 dark:text-slate-400 text-sm">Iniciando sesión con Google…</p>
  </div>
  <script src="/js/api.js?v=5"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      if (!code) {
        window.location.replace("/login.html?error=google_token");
        return;
      }
      try {
        const res = await fetch(`/api/auth/google/exchange?code=${encodeURIComponent(code)}`);
        if (!res.ok) throw new Error("exchange_failed");
        const data = await res.json();
        setSession(data.access_token, data.user_name || "", data.terms_accepted ? "true" : "false", data.onboarding_done, data.refresh_token);
        if (data.picture) localStorage.setItem("google_picture", data.picture);
        else localStorage.removeItem("google_picture");
        if (!data.terms_accepted) { window.location.replace("/terms.html"); return; }
        window.location.replace(data.onboarding_done ? "/dashboard.html" : "/onboarding.html");
      } catch {
        window.location.replace("/login.html?error=google_token");
      }
    })();
  </script>
</body>
</html>
