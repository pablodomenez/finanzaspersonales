<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciando sesión…</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900">
  <div class="text-center">
    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-slate-500 dark:text-slate-400 text-sm">Iniciando sesión con Google…</p>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const name = params.get("name");
    const picture = params.get("picture");
    const termsAccepted = params.get("terms_accepted");
    if (token) {
      setSession(token, name || "", termsAccepted);
      if (picture) localStorage.setItem("google_picture", picture);
      else localStorage.removeItem("google_picture");
      window.location.replace(termsAccepted === "true" ? "/dashboard.html" : "/terms.html");
    } else {
      window.location.replace("/login.html?error=google_token");
    }
  </script>
</body>
</html>
