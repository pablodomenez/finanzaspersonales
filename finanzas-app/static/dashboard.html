<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzasApp — Dashboard</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col z-10"></aside>

  <!-- Main -->
  <main class="ml-60 p-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Dashboard</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1" id="period-label"></p>
      </div>
      <div class="flex gap-2">
        <select id="month-select" class="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="1">Enero</option><option value="2">Febrero</option>
          <option value="3">Marzo</option><option value="4">Abril</option>
          <option value="5">Mayo</option><option value="6">Junio</option>
          <option value="7">Julio</option><option value="8">Agosto</option>
          <option value="9">Septiembre</option><option value="10">Octubre</option>
          <option value="11">Noviembre</option><option value="12">Diciembre</option>
        </select>
        <select id="year-select" class="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
      </div>
    </div>

    <!-- KPI cards -->
    <div class="grid grid-cols-3 gap-6 mb-8">
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
        <p class="text-sm text-gray-500 dark:text-gray-400">Balance del mes</p>
        <p id="kpi-balance" class="text-3xl font-bold mt-1 text-gray-900 dark:text-white">—</p>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
        <p class="text-sm text-gray-500 dark:text-gray-400">💚 Ingresos</p>
        <p id="kpi-income" class="text-3xl font-bold mt-1 text-green-600 dark:text-green-400">—</p>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
        <p class="text-sm text-gray-500 dark:text-gray-400">🔴 Gastos</p>
        <p id="kpi-expense" class="text-3xl font-bold mt-1 text-red-500 dark:text-red-400">—</p>
      </div>
    </div>

    <!-- Charts + Recent -->
    <div class="grid grid-cols-3 gap-6 mb-8">
      <!-- Donut -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
        <h3 class="font-semibold text-gray-700 dark:text-gray-300 mb-4 text-sm">Gastos por categoría</h3>
        <div class="relative h-52">
          <canvas id="donut-chart"></canvas>
          <p id="no-expenses" class="hidden absolute inset-0 flex items-center justify-center text-gray-400 text-sm">Sin gastos este mes</p>
        </div>
      </div>

      <!-- Bar chart (span 2) -->
      <div class="col-span-2 bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
        <h3 class="font-semibold text-gray-700 dark:text-gray-300 mb-4 text-sm">Ingresos vs Gastos (últimos 6 meses)</h3>
        <div class="h-52">
          <canvas id="bar-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- Recent transactions -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-700 dark:text-gray-300 text-sm">Últimas transacciones</h3>
        <a href="/transactions.html" class="text-blue-600 dark:text-blue-400 text-sm hover:underline">Ver todas →</a>
      </div>
      <div id="recent-list" class="space-y-3">
        <p class="text-gray-400 text-sm">Cargando...</p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
