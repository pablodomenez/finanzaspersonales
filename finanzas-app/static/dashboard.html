<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzasApp — Dashboard</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 flex flex-col z-10 border-r border-slate-800"></aside>

  <main class="ml-64 min-h-screen flex flex-col">
    <!-- Top bar -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 class="text-lg font-semibold text-slate-800 dark:text-white">Dashboard</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" id="period-label"></p>
      </div>
      <div class="flex gap-2">
        <select id="month-select" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
          <option value="1">Enero</option><option value="2">Febrero</option>
          <option value="3">Marzo</option><option value="4">Abril</option>
          <option value="5">Mayo</option><option value="6">Junio</option>
          <option value="7">Julio</option><option value="8">Agosto</option>
          <option value="9">Septiembre</option><option value="10">Octubre</option>
          <option value="11">Noviembre</option><option value="12">Diciembre</option>
        </select>
        <select id="year-select" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></select>
      </div>
    </header>

    <div class="p-8 flex-1">
      <!-- KPI cards -->
      <div class="grid grid-cols-3 gap-5 mb-6">
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5 flex items-start gap-4">
          <div class="w-1 self-stretch rounded-full bg-slate-400"></div>
          <div>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Balance del mes</p>
            <p id="kpi-balance" class="text-2xl font-bold mt-1 text-slate-800 dark:text-white">—</p>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5 flex items-start gap-4">
          <div class="w-1 self-stretch rounded-full bg-emerald-500"></div>
          <div>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Ingresos</p>
            <p id="kpi-income" class="text-2xl font-bold mt-1 text-emerald-600 dark:text-emerald-400">—</p>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5 flex items-start gap-4">
          <div class="w-1 self-stretch rounded-full bg-red-500"></div>
          <div>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Gastos</p>
            <p id="kpi-expense" class="text-2xl font-bold mt-1 text-red-600 dark:text-red-400">—</p>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-3 gap-5 mb-6">
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5">
          <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Gastos por categoría</h3>
          <div class="relative h-52">
            <canvas id="donut-chart"></canvas>
            <p id="no-expenses" class="hidden absolute inset-0 flex items-center justify-center text-slate-400 text-sm">Sin gastos este mes</p>
          </div>
        </div>
        <div class="col-span-2 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5">
          <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Ingresos vs Gastos — últimos 6 meses</h3>
          <div class="h-52">
            <canvas id="bar-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- Recent transactions -->
      <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
          <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Últimas transacciones</h3>
          <a href="/transactions.html" class="text-blue-600 dark:text-blue-400 text-xs font-medium hover:underline">Ver todas →</a>
        </div>
        <div id="recent-list" class="divide-y divide-slate-100 dark:divide-slate-800">
          <p class="px-6 py-4 text-slate-400 text-sm">Cargando...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
