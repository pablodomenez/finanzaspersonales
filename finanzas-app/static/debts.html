<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>FinanzasApp — Deudas</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/design.css" />
  <script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: "#2563eb", hover: "#1d4ed8", light: "#dbeafe" }
        },
        fontFamily: {
          sans: ["Inter", "system-ui", "-apple-system", "sans-serif"]
        }
      }
    }
  };
</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 flex flex-col z-20 border-r border-slate-800 -translate-x-full md:translate-x-0 transition-transform duration-300"></aside>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden" onclick="closeSidebar()"></div>

  <main class="md:ml-64 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-4 md:px-8 py-4 flex items-center gap-3 sticky top-0 z-10">
      <button class="md:hidden p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 flex-shrink-0" onclick="openSidebar()" aria-label="Abrir menú">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex-1 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Deudas y créditos</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Lo que debés y lo que te deben</p>
      </div>
      <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
        + Nueva deuda
      </button>
      </div>
    </header>

    <div class="p-4 md:p-8 flex-1">
      <!-- KPIs -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5 flex items-start gap-4">
          <div class="w-1 self-stretch rounded-full bg-red-500"></div>
          <div>
            <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Lo que debo</p>
            <p id="kpi-owe" class="text-2xl font-bold text-red-600 dark:text-red-400 mt-1">—</p>
            <p id="kpi-owe-count" class="text-xs text-slate-400 mt-0.5"></p>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 p-5 flex items-start gap-4">
          <div class="w-1 self-stretch rounded-full bg-emerald-500"></div>
          <div>
            <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Lo que me deben</p>
            <p id="kpi-owed" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">—</p>
            <p id="kpi-owed-count" class="text-xs text-slate-400 mt-0.5"></p>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex gap-1 mb-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-1 w-fit">
        <button id="tab-all" onclick="setTab('all')" class="px-4 py-1.5 rounded-md text-sm font-medium bg-blue-700 text-white transition">Todas</button>
        <button id="tab-owe" onclick="setTab('owe')" class="px-4 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Debo</button>
        <button id="tab-owed" onclick="setTab('owed')" class="px-4 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Me deben</button>
      </div>

      <div id="debts-list" class="space-y-3">
        <p class="text-slate-400 text-sm">Cargando...</p>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 px-4">
    <div class="bg-white dark:bg-slate-900 rounded-lg shadow-xl w-full max-w-sm border border-slate-200 dark:border-slate-700">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
        <h2 class="text-base font-semibold text-slate-800 dark:text-white">Nueva deuda</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 text-lg leading-none">✕</button>
      </div>
      <div class="p-6">
        <div id="modal-error" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>
        <form id="debt-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Tipo</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center gap-2 p-3 rounded-lg border-2 border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-900/20 cursor-pointer has-[:checked]:border-red-500">
                <input type="radio" name="d-type" value="owe" checked class="accent-red-500" />
                <span class="text-sm font-medium text-red-700 dark:text-red-300">Yo debo</span>
              </label>
              <label class="flex items-center gap-2 p-3 rounded-lg border-2 border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-900/20 cursor-pointer has-[:checked]:border-emerald-500">
                <input type="radio" name="d-type" value="owed" class="accent-emerald-500" />
                <span class="text-sm font-medium text-emerald-700 dark:text-emerald-300">Me deben</span>
              </label>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Persona</label>
            <input type="text" id="d-person" required placeholder="Nombre o empresa"
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Descripción (opcional)</label>
            <input type="text" id="d-description" placeholder="Ej: Préstamo para el auto"
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Monto</label>
            <input type="number" id="d-amount" min="0.01" step="0.01" required
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Fecha límite (opcional)</label>
            <input type="date" id="d-due-date"
              class="w-full px-3 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition">Cancelar</button>
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition disabled:opacity-60">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=5"></script>
  <script src="/js/sidebar.js?v=5"></script>
  <script src="/js/common.js?v=5"></script>
  <script src="/js/debts.js"></script>
</body>
</html>
