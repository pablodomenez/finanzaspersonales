<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Olvidé mi contraseña — Finanzas Personales</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900 px-4">

  <div id="form-container" class="w-full max-w-sm opacity-0 translate-y-4" style="transition: opacity 0.4s ease, transform 0.4s ease;">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);">
        <svg width="22" height="22" viewBox="0 0 18 18" fill="none"><rect x="1" y="11" width="4" height="6" rx="1.2" fill="white" opacity="0.6"/><rect x="7" y="6.5" width="4" height="10.5" rx="1.2" fill="white" opacity="0.8"/><rect x="13" y="2" width="4" height="15" rx="1.2" fill="white"/></svg>
      </div>
      <div>
        <span class="text-slate-800 dark:text-white font-bold text-base leading-tight block">Finanzas Personales</span>
        <span class="text-xs text-slate-400 leading-tight block">by PabloFinance</span>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-8">

      <div id="step-form">
        <div class="flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900/30 mx-auto mb-4">
          <i data-lucide="key-round" class="w-6 h-6 text-blue-600 dark:text-blue-400"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-800 dark:text-white text-center mb-1">¿Olvidaste tu contraseña?</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm text-center mb-6">Ingresá tu email y te enviamos un enlace para crear una nueva.</p>

        <div id="error-msg" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>

        <form id="forgot-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Correo electrónico</label>
            <input type="email" id="email" required placeholder="nombre@ejemplo.com"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" />
          </div>
          <button type="submit" id="submit-btn"
            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg text-sm transition disabled:opacity-60">
            Enviar enlace de recuperación
          </button>
        </form>
      </div>

      <!-- Estado de éxito -->
      <div id="step-success" class="hidden text-center">
        <div class="flex items-center justify-center w-14 h-14 rounded-full bg-emerald-100 dark:bg-emerald-900/30 mx-auto mb-4">
          <i data-lucide="mail-check" class="w-7 h-7 text-emerald-600 dark:text-emerald-400"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-800 dark:text-white mb-2">¡Email enviado!</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm mb-1">Si tu email está registrado, vas a recibir un enlace para restablecer tu contraseña.</p>
        <p class="text-slate-400 dark:text-slate-500 text-xs">Revisá también tu carpeta de spam.</p>
      </div>

    </div>

    <p class="text-center mt-5">
      <a href="/login.html" class="text-sm text-blue-600 dark:text-blue-400 hover:underline flex items-center justify-center gap-1.5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al inicio de sesión
      </a>
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("form-container");
      requestAnimationFrame(() => {
        container.style.opacity = "1";
        container.style.transform = "translateY(0)";
      });
      lucide.createIcons();
    });

    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const errEl = document.getElementById("error-msg");
      btn.disabled = true;
      btn.textContent = "Enviando...";
      errEl.classList.add("hidden");
      try {
        await apiFetch("/api/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({ email: document.getElementById("email").value }),
        });
        document.getElementById("step-form").classList.add("hidden");
        document.getElementById("step-success").classList.remove("hidden");
      } catch (err) {
        errEl.textContent = err.message || "Error al procesar la solicitud. Intentá de nuevo.";
        errEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Enviar enlace de recuperación";
      }
    });
  </script>
</body>
</html>
