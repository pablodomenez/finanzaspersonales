<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzasApp — Tarjetas</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">

  <aside id="sidebar" class="fixed inset-y-0 left-0 w-60 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col z-10"></aside>

  <main class="ml-60 p-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Tarjetas de crédito</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Gastos, cuotas y resumen mensual</p>
      </div>
      <div class="flex gap-3 items-center">
        <select id="month-select" class="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="1">Enero</option><option value="2">Febrero</option>
          <option value="3">Marzo</option><option value="4">Abril</option>
          <option value="5">Mayo</option><option value="6">Junio</option>
          <option value="7">Julio</option><option value="8">Agosto</option>
          <option value="9">Septiembre</option><option value="10">Octubre</option>
          <option value="11">Noviembre</option><option value="12">Diciembre</option>
        </select>
        <select id="year-select" class="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        <button onclick="openExpenseModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
          + Nuevo gasto
        </button>
        <button onclick="openCardModal()" class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-semibold px-4 py-2 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition">
          + Tarjeta
        </button>
      </div>
    </div>

    <!-- Total del mes -->
    <div id="total-banner" class="hidden bg-gradient-to-r from-blue-600 to-blue-700 rounded-2xl p-6 mb-8 text-white shadow-lg">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-blue-100 text-sm font-medium">Total a pagar este mes</p>
          <p id="grand-total" class="text-4xl font-bold mt-1">—</p>
        </div>
        <div class="text-right">
          <p class="text-blue-100 text-sm" id="total-period"></p>
          <p id="total-cards-count" class="text-blue-200 text-sm mt-1"></p>
        </div>
        <div class="text-6xl opacity-20">💳</div>
      </div>
    </div>

    <!-- Empty state: sin tarjetas -->
    <div id="empty-state" class="hidden text-center py-20 text-gray-400">
      <p class="text-6xl mb-4">💳</p>
      <p class="text-lg font-medium text-gray-500 dark:text-gray-400">No tenés tarjetas registradas</p>
      <p class="text-sm mt-2">Agregá tu primera tarjeta para empezar a registrar gastos</p>
      <button onclick="openCardModal()" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition">
        + Agregar tarjeta
      </button>
    </div>

    <!-- Cards grid -->
    <div id="cards-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 mb-10">
      <p class="text-gray-400 text-sm col-span-3">Cargando...</p>
    </div>

    <!-- Expenses table -->
    <div id="expenses-section" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-gray-800 dark:text-white">Cuotas activas este mes</h2>
        <span id="expenses-count" class="text-sm text-gray-400"></span>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 dark:bg-gray-750 border-b border-gray-200 dark:border-gray-700">
            <tr>
              <th class="text-left px-6 py-3 text-gray-500 dark:text-gray-400 font-medium">Descripción</th>
              <th class="text-left px-6 py-3 text-gray-500 dark:text-gray-400 font-medium">Tarjeta</th>
              <th class="text-center px-6 py-3 text-gray-500 dark:text-gray-400 font-medium">Cuota</th>
              <th class="text-right px-6 py-3 text-gray-500 dark:text-gray-400 font-medium">Monto cuota</th>
              <th class="text-right px-6 py-3 text-gray-500 dark:text-gray-400 font-medium">Total compra</th>
              <th class="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody id="expenses-body">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal nueva tarjeta -->
  <div id="card-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 id="card-modal-title" class="text-lg font-semibold text-gray-800 dark:text-white">Nueva tarjeta</h2>
        <button onclick="closeCardModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-xl">✕</button>
      </div>
      <div id="card-modal-error" class="hidden bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>
      <form id="card-form" class="space-y-4">
        <input type="hidden" id="edit-card-id" />
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nombre de la tarjeta</label>
            <input type="text" id="c-name" required placeholder="Ej: Visa Galicia"
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Banco (opcional)</label>
            <input type="text" id="c-bank" placeholder="Ej: Galicia"
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Últimos 4 dígitos</label>
            <input type="text" id="c-last-four" maxlength="4" placeholder="1234"
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Límite de crédito</label>
            <input type="number" id="c-limit" min="0" step="1000" placeholder="Opcional"
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Día de cierre</label>
            <input type="number" id="c-closing" min="1" max="31" placeholder="Ej: 15"
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Día de vencimiento</label>
            <input type="number" id="c-due" min="1" max="31" placeholder="Ej: 5"
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>
        <!-- Color picker -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Color</label>
          <div id="color-picker" class="flex gap-2 flex-wrap"></div>
          <input type="hidden" id="c-color" value="#3b82f6" />
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeCardModal()" class="flex-1 px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition">Cancelar</button>
          <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition disabled:opacity-60">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal nuevo gasto -->
  <div id="expense-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-sm p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-800 dark:text-white">Nuevo gasto</h2>
        <button onclick="closeExpenseModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-xl">✕</button>
      </div>
      <div id="expense-modal-error" class="hidden bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>
      <form id="expense-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tarjeta</label>
          <select id="e-card" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Descripción</label>
          <input type="text" id="e-desc" required placeholder="Ej: iPhone 16 Pro"
            class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Monto total</label>
            <input type="number" id="e-amount" min="0.01" step="0.01" required
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cuotas</label>
            <input type="number" id="e-installments" min="1" max="120" value="1" required
              class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>
        <!-- Preview cuota -->
        <div id="installment-preview" class="hidden bg-blue-50 dark:bg-blue-900/20 rounded-lg px-3 py-2 text-sm text-blue-700 dark:text-blue-300 text-center"></div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">1er pago — Mes</label>
            <select id="e-month" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="1">Enero</option><option value="2">Febrero</option>
              <option value="3">Marzo</option><option value="4">Abril</option>
              <option value="5">Mayo</option><option value="6">Junio</option>
              <option value="7">Julio</option><option value="8">Agosto</option>
              <option value="9">Septiembre</option><option value="10">Octubre</option>
              <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Año</label>
            <select id="e-year" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
          </div>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeExpenseModal()" class="flex-1 px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700 transition">Cancelar</button>
          <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition disabled:opacity-60">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/cards.js"></script>
</body>
</html>
