<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzasApp — Iniciar sesión</title>
  <script src="/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center px-4">

  <button id="theme-toggle"
    class="fixed top-4 right-4 text-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full w-10 h-10 flex items-center justify-center shadow hover:scale-110 transition">
  </button>

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">💰</div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">FinanzasApp</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Controlá tus finanzas personales</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8">
      <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-6">Iniciar sesión</h2>

      <div id="error-msg" class="hidden bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 mb-4"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
          <input type="email" id="email" required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
          <input type="password" id="password" required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-60">
          Entrar
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
        ¿No tenés cuenta?
        <a href="/register.html" class="text-blue-600 dark:text-blue-400 font-medium hover:underline">Registrate</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (getToken()) window.location.href = "/dashboard.html";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Entrando...";
      const errEl = document.getElementById("error-msg");
      errEl.classList.add("hidden");

      try {
        const data = await apiFetch("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        setSession(data.access_token, data.user_name);
        window.location.href = "/dashboard.html";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
